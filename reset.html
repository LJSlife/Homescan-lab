<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset HomeScan</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:32px"><h1>Refreshing HomeScan…</h1><p>This clears the old offline files and opens the current build.</p><script>(async()=>{try{if("serviceWorker" in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();}if("caches" in window){for(const k of await caches.keys())await caches.delete(k);}}finally{location.replace("./?build=3.0.1&t="+Date.now());}})();</script></body></html>
